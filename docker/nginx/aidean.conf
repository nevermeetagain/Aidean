# Aidean Web 反向代理站点（Task：prod compose web/nginx 服务补全，2026-08-29）
#
# 挂载方式：经 docker-compose.prod.yml 挂至 /etc/nginx/conf.d/default.conf，
# 使用 nginx 镜像默认主配置（已 include conf.d/*.conf），与 docker/nginx/nginx.conf
# （RagFlow 专用资产，include conf.d/ragflow.conf）互不干扰。
# proxy.conf 为通用代理头（proxy_buffering off 同时利好未来 SSE 流式透传）。

upstream aidean_web {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # LCP 保障：静态资源长缓存（Next.js build 产物带内容哈希）
    location /_next/static/ {
        proxy_pass http://aidean_web;
        include /etc/nginx/proxy.conf;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://aidean_web;
        include /etc/nginx/proxy.conf;
    }
}
