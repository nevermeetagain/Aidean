# Aidean 生态共享基础设施（PostgreSQL + Redis）
# 启动: docker compose -f docker/shared-infra/docker-compose.yml up -d
# 端口: PG 5435 / Redis 6379（与各项目 .env 约定对齐）
# 隔离: PG 按库名、Redis 按 DB index

services:
  postgres:
    image: postgres:16-alpine
    container_name: shared-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aidean
      TZ: Asia/Shanghai
    ports:
      - "5435:5432"
    volumes:
      - shared_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - shared_redisdata:/data
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  shared_pgdata:
  shared_redisdata:
