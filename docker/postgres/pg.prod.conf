# Aidean PostgreSQL 生产环境配置
# Ubuntu Docker HA集群版

# ============================
# 内存 (4GB)
# ============================
shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 512MB
work_mem = 16MB

# ============================
# 连接
# ============================
max_connections = 500
superuser_reserved_connections = 3

# ============================
# WAL (流复制)
# ============================
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB
max_slot_wal_keep_size = -1
hot_standby = on
hot_standby_feedback = on

# ============================
# 归档
# ============================
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal/%f && cp %p /var/lib/postgresql/wal/%f'
archive_timeout = 300

# ============================
# 日志
# ============================
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500  # 慢查询阈值500ms
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_statement = 'ddl'

# ============================
# 时区
# ============================
timezone = 'Asia/Shanghai'
datestyle = 'iso, mdy'
intervalstyle = 'postgres'
timezone_abbreviations = 'Default'

# ============================
# 字符集
# ============================
client_encoding = UTF8
server_encoding = UTF8

# ============================
# Autovacuum (生产环境优化)
# ============================
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 200

# ============================
# 查询优化
# ============================
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200
constraint_exclusion = partition
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005

# ============================
# 并发
# ============================
max_worker_processes = 16
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
parallel_leader_participation = on

# ============================
# 监控
# ============================
shared_preload_libraries = 'pg_stat_statements,pg_cron'
pg_stat_statements.track = all
pg_cron.use_background_workers = on

# ============================
# 安全
# ============================
listen_addresses = '0.0.0.0'
ssl = on
ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'
password_encryption = scram-sha-256

# ============================
# 资源限制
# ============================
max_stack_depth = 8MB
shared_memory = 'mmap'
dynamic_shared_memory_type = posix

# ============================
# 字符排序 (生产环境)
# ============================
lc_collate = 'zh_CN.UTF-8'
lc_ctype = 'zh_CN.UTF-8'

# ============================
# 复制相关超时
# ============================
wal_sender_timeout = 60s
wal_receiver_timeout = 60s
wal_retrieve_retry_interval = 5s
recovery_min_apply_delay = 0

# ============================
# 故障转移
# ============================
promote_trigger_file = '/tmp/pg_failover_trigger'
