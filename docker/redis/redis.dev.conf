# Aidean Redis 开发环境配置
# 版本: 1.0
# 用途: Windows本地开发环境
# ============================

# 基础配置
port 6379
daemonize no
supervised no
pidfile /var/run/redis.pid
logfile ""
dir ./

# 内存限制 (开发环境2GB)
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# 持久化配置 (RDB + AOF)
save 60 1
save 300 10
save 900 100
dbfilename dump.rdb
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 日志 (开发环境详细)
loglevel debug

# 网络配置 (容器内绑定所有接口；不可同时列 127.0.0.1 与 0.0.0.0——0.0.0.0 已覆盖前者，会 EADDRINUSE)
bind 0.0.0.0
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 客户端连接
maxclients 1000

# 数据库数量 (开发环境16个足够)
databases 16

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 命令重命名 (安全)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""

# 事件通知 (用于缓存失效)
notify-keyspace-events Ex

# 客户端输出缓冲区
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# 禁用危险命令 (可选)
# rename-command CONFIG ""
