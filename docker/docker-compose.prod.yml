# Aidean PostgreSQL + Redis Docker 生产环境配置
# Ubuntu HA集群版

services:
  # ============================
  # PostgreSQL 主库
  # ============================
  postgres-primary:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/postgres:16-alpine
    container_name: aidean-postgres-primary
    restart: always
    privileged: true
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aidean
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg.prod.conf:/etc/postgresql/postgresql.conf:ro
      - postgres_primary_data:/var/lib/postgresql/data
      - postgres_wal:/var/lib/postgresql/wal
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d aidean -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ============================
  # PostgreSQL 同步从库
  # ============================
  postgres-replica-sync:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/postgres:16-alpine
    container_name: aidean-postgres-replica-sync
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - postgres_replica_sync_data:/var/lib/postgresql/data
      - ./postgres/pg.prod.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hot_standby=on
      - -c
      - primary_conninfo=host=postgres-primary port=5432 user=replicator password=${REPLICATOR_PASSWORD}
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================
  # PostgreSQL 异步从库 (延迟4小时)
  # ============================
  postgres-replica-async:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/postgres:16-alpine
    container_name: aidean-postgres-replica-async
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - postgres_replica_async_data:/var/lib/postgresql/data
      - ./postgres/pg.prod.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hot_standby=on
      - -c
      - primary_conninfo=host=postgres-primary port=5432 user=replicator password=${REPLICATOR_PASSWORD}
      - -c
      - recovery_min_apply_delay=4h
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ============================
  # Redis 主节点
  # ============================
  redis-primary:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/redis:7-alpine
    container_name: aidean-redis-primary
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 8gb
      --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_primary_data:/data
      - ./redis/redis.prod.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G

  # ============================
  # Redis 从节点1
  # ============================
  redis-replica-1:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/redis:7-alpine
    container_name: aidean-redis-replica-1
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --replicaof redis-primary 6379
      --masterauth ${REDIS_PASSWORD}
    depends_on:
      - redis-primary
    volumes:
      - redis_replica_1_data:/data
    networks:
      - aidean-prod

  # ============================
  # Redis 从节点2
  # ============================
  redis-replica-2:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/redis:7-alpine
    container_name: aidean-redis-replica-2
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --replicaof redis-primary 6379
      --masterauth ${REDIS_PASSWORD}
    depends_on:
      - redis-primary
    volumes:
      - redis_replica_2_data:/data
    networks:
      - aidean-prod

  # ============================
  # Redis Sentinel (故障转移)
  # ============================
  redis-sentinel-1:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/redis:7-alpine
    container_name: aidean-redis-sentinel-1
    restart: always
    command: >
      redis-sentinel
      --sentinel monitor mymaster redis-primary 6379 2
      --sentinel down-after-milliseconds 5000
      --sentinel failover-timeout 60000
      --sentinel parallel-syncs 1
    depends_on:
      - redis-primary
      - redis-replica-1
      - redis-replica-2
    networks:
      - aidean-prod

  redis-sentinel-2:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/redis:7-alpine
    container_name: aidean-redis-sentinel-2
    restart: always
    command: >
      redis-sentinel
      --sentinel monitor mymaster redis-primary 6379 2
      --sentinel down-after-milliseconds 5000
      --sentinel failover-timeout 60000
      --sentinel parallel-syncs 1
    depends_on:
      - redis-primary
      - redis-replica-1
      - redis-replica-2
    networks:
      - aidean-prod

  redis-sentinel-3:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/redis:7-alpine
    container_name: aidean-redis-sentinel-3
    restart: always
    command: >
      redis-sentinel
      --sentinel monitor mymaster redis-primary 6379 2
      --sentinel down-after-milliseconds 5000
      --sentinel failover-timeout 60000
      --sentinel parallel-syncs 1
    depends_on:
      - redis-primary
      - redis-replica-1
      - redis-replica-2
    networks:
      - aidean-prod

  # ============================
  # PgBouncer 连接池
  # ============================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: aidean-pgbouncer
    restart: always
    environment:
      DATABASE_URL: postgres://root:${POSTGRES_PASSWORD}@postgres-primary:5432/aidean
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
    ports:
      - "6432:5432"
    depends_on:
      - postgres-primary
    networks:
      - aidean-prod

  # ============================
  # Aidean Web（Next.js standalone）
  # ============================
  # 镜像由仓库根 Dockerfile 构建并在 CI 持续验证（ aidean-web:ci / 部署期推 registry 后改 image 引用）；
  # NODE_ENV=production 下 mock 上游路由运行时守卫自动 404（AIDEAN_ENABLE_MOCK_UPSTREAM 不设置）。
  web:
    image: aidean-web:latest
    container_name: aidean-web
    restart: always
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # 经 PgBouncer transaction 池化连接（pgbouncer=true 声明禁用 prepared statements 语义）
      DATABASE_URL: postgres://root:${POSTGRES_PASSWORD}@pgbouncer:5432/aidean?schema=public&pgbouncer=true&connection_limit=10
      # MVP 直连主节点；Redis Sentinel 拓扑的应用侧适配登记为遗留项（getRedis 单点 URL 口径）
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-primary:6379
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    depends_on:
      pgbouncer:
        condition: service_started
      redis-primary:
        condition: service_healthy
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ============================
  # Nginx 反向代理（对外 80 入口）
  # ============================
  # 挂载 aidean 专用站点配置至 conf.d/default.conf；镜像默认主配置已 include conf.d/*。
  # 不挂载 docker/nginx/nginx.conf（RagFlow 专用资产，其 include 的 ragflow.conf 不在本仓库）。
  nginx:
    image: nginx:1.27-alpine
    container_name: aidean-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/aidean.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
    depends_on:
      - web
    networks:
      - aidean-prod


  # ============================
  # PostgreSQL 每日备份 sidecar（R-60）
  # ============================
  # 每日 02:00 执行 pg_dump 全量备份，保留 30 天，输出到 backup_data volume。
  postgres-backup:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/postgres:16-alpine
    container_name: aidean-postgres-backup
    restart: always
    environment:
      PG_HOST: postgres-primary
      PG_PORT: "5432"
      PG_USER: root
      PG_DB: aidean
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./postgres/backup-entrypoint.sh:/usr/local/bin/backup-entrypoint.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-entrypoint.sh"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ============================
  # 定时脚本调度器 sidecar（R-70）
  # ============================
  # 每分钟调用 admin API run-due endpoint，触发到期 ScheduledScript 执行。
  scheduler:
    image: alpine:3.20
    container_name: aidean-scheduler
    restart: always
    environment:
      TZ: Asia/Shanghai
      WEB_URL: "http://web:3000"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    volumes:
      - ./scheduler/entrypoint.sh:/usr/local/bin/scheduler-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/scheduler-entrypoint.sh"]
    depends_on:
      - web
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
volumes:
  postgres_primary_data:
    driver: local
  postgres_replica_sync_data:
    driver: local
  postgres_replica_async_data:
    driver: local
  postgres_wal:
    driver: local
  redis_primary_data:
    driver: local
  redis_replica_1_data:
    driver: local
  redis_replica_2_data:
    driver: local
  backup_data:
    driver: local

networks:
  aidean-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
