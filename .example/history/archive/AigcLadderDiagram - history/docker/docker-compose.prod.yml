# Aidean PostgreSQL + Redis Docker 生产环境配置
# Ubuntu HA集群版

services:
  # ============================
  # PostgreSQL 主库
  # ============================
  postgres-primary:
    image: postgres:16-alpine
    container_name: aidean-postgres-primary
    restart: always
    privileged: true
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aidean
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg.prod.conf:/etc/postgresql/postgresql.conf:ro
      - postgres_primary_data:/var/lib/postgresql/data
      - postgres_wal:/var/lib/postgresql/wal
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d aidean -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ============================
  # PostgreSQL 同步从库
  # ============================
  postgres-replica-sync:
    image: postgres:16-alpine
    container_name: aidean-postgres-replica-sync
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - postgres_replica_sync_data:/var/lib/postgresql/data
      - ./postgres/pg.prod.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hot_standby=on
      - -c
      - primary_conninfo=host=postgres-primary port=5432 user=replicator password=${REPLICATOR_PASSWORD}
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================
  # PostgreSQL 异步从库 (延迟4小时)
  # ============================
  postgres-replica-async:
    image: postgres:16-alpine
    container_name: aidean-postgres-replica-async
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - postgres_replica_async_data:/var/lib/postgresql/data
      - ./postgres/pg.prod.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hot_standby=on
      - -c
      - primary_conninfo=host=postgres-primary port=5432 user=replicator password=${REPLICATOR_PASSWORD}
      - -c
      - recovery_min_apply_delay=4h
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ============================
  # Redis 主节点
  # ============================
  redis-primary:
    image: redis:7-alpine
    container_name: aidean-redis-primary
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 8gb
      --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_primary_data:/data
      - ./redis/redis.prod.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - aidean-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G

  # ============================
  # Redis 从节点1
  # ============================
  redis-replica-1:
    image: redis:7-alpine
    container_name: aidean-redis-replica-1
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --replicaof redis-primary 6379
      --masterauth ${REDIS_PASSWORD}
    depends_on:
      - redis-primary
    volumes:
      - redis_replica_1_data:/data
    networks:
      - aidean-prod

  # ============================
  # Redis 从节点2
  # ============================
  redis-replica-2:
    image: redis:7-alpine
    container_name: aidean-redis-replica-2
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --replicaof redis-primary 6379
      --masterauth ${REDIS_PASSWORD}
    depends_on:
      - redis-primary
    volumes:
      - redis_replica_2_data:/data
    networks:
      - aidean-prod

  # ============================
  # Redis Sentinel (故障转移)
  # ============================
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: aidean-redis-sentinel-1
    restart: always
    command: >
      redis-sentinel
      --sentinel monitor mymaster redis-primary 6379 2
      --sentinel down-after-milliseconds 5000
      --sentinel failover-timeout 60000
      --sentinel parallel-syncs 1
    depends_on:
      - redis-primary
      - redis-replica-1
      - redis-replica-2
    networks:
      - aidean-prod

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: aidean-redis-sentinel-2
    restart: always
    command: >
      redis-sentinel
      --sentinel monitor mymaster redis-primary 6379 2
      --sentinel down-after-milliseconds 5000
      --sentinel failover-timeout 60000
      --sentinel parallel-syncs 1
    depends_on:
      - redis-primary
      - redis-replica-1
      - redis-replica-2
    networks:
      - aidean-prod

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: aidean-redis-sentinel-3
    restart: always
    command: >
      redis-sentinel
      --sentinel monitor mymaster redis-primary 6379 2
      --sentinel down-after-milliseconds 5000
      --sentinel failover-timeout 60000
      --sentinel parallel-syncs 1
    depends_on:
      - redis-primary
      - redis-replica-1
      - redis-replica-2
    networks:
      - aidean-prod

  # ============================
  # PgBouncer 连接池
  # ============================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: aidean-pgbouncer
    restart: always
    environment:
      DATABASE_URL: postgres://root:${POSTGRES_PASSWORD}@postgres-primary:5432/aidean
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
    ports:
      - "6432:5432"
    depends_on:
      - postgres-primary
    networks:
      - aidean-prod

volumes:
  postgres_primary_data:
    driver: local
  postgres_replica_sync_data:
    driver: local
  postgres_replica_async_data:
    driver: local
  postgres_wal:
    driver: local
  redis_primary_data:
    driver: local
  redis_replica_1_data:
    driver: local
  redis_replica_2_data:
    driver: local

networks:
  aidean-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
