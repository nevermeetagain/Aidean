# Aidean PostgreSQL + Redis Docker 开发环境配置
# Windows WSL2优化版

services:
  postgres:
    image: postgres:16-alpine
    container_name: aidean-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: NewPassword123!
      POSTGRES_DB: aidean
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg.dev.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d aidean"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aidean-dev

  redis:
    image: redis:7-alpine
    container_name: aidean-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
      - ./redis/redis.dev.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - aidean-dev

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aidean-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aidean.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      TZ: Asia/Shanghai
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - aidean-dev

volumes:
  postgres_data_dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/wslg/docker-desktop-data/volumes/ubuntu2204/ext4_vol/dev/disk/by-uuid/aidean_postgres_dev
      # 注意：实际路径需根据WSL2实际挂载点调整
  redis_data_dev:
    driver: local
  pgadmin_data_dev:
    driver: local

networks:
  aidean-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
